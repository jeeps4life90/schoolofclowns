<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>School of Clowns</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#050816;
      color:white;
    }

    header{
      background:#081229;
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:2px solid #00bfff;
      position:sticky;
      top:0;
      z-index:100;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:15px;
    }

    .logo img{
      width:70px;
      height:70px;
      object-fit:contain;
    }

    .logo h1{
      color:#00bfff;
      font-size:2rem;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:20px;
      transition:0.3s;
    }

    nav a:hover{
      color:#00bfff;
    }

    .hero{
      height:85vh;
      background:linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.65)),
      url('https://images.unsplash.com/photo-1520301255226-bf5f144451c1?q=80&w=1600&auto=format&fit=crop');
      background-size:cover;
      background-position:center;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
    }

      font-size:4rem;
      color:#00bfff;
