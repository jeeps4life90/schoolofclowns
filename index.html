<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School of Clowns</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <img src="logo.svg" class="logo" alt="School of Clowns Logo">
    <h1>School of Clowns</h1>
    <p>Premium Designer Clownfish</p>
  </header>

  <main class="grid">
    <div class="card">
      <h2>Black Storm</h2>
      <p>Rare designer clownfish with bold black and white patterns.</p>
      <button>Reserve Now</button>
    </div>

    <div class="card">
      <h2>Wyoming White</h2>
      <p>Clean white body with vibrant orange accents.</p>
      <button>Reserve Now</button>
    </div>

    <div class="card">
      <h2>Black Ice</h2>
      <p>Deep black coloration with icy blue highlights.</p>
      <button>Reserve Now</button>
    </div>
  </main>
</body>
</html>
