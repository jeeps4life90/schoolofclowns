<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>School of Clowns</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<header>
  <img src="logo.svg" class="logo" alt="School of Clowns Logo">
  <h1>School of Clowns</h1>
  <p>Premium Designer Clownfish</p>
</header>

<section class="fish-grid">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1520301255226-bf5f144451c1?q=80&w=1200&auto=format&fit=crop" alt="">
    <h2>Black Storm</h2>
    <p>Rare designer clownfish with striking black and white patterns.</p>
    <button>Reserve Now</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1546026423-cc4642628d2b?q=80&w=1200&auto=format&fit=crop" alt="">
    <h2>Wyoming White</h2>
    <p>Beautiful premium clownfish with vivid white coloration.</p>
    <button>Reserve Now</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1524704654690-b56c05c78a00?q=80&w=1200&auto=format&fit=crop" alt="">
    <h2>Snowflake Clown</h2>
    <p>High-pattern snowflake clownfish bred for unique markings.</p>
    <button>Reserve Now</button>
  </div>

</section>

<footer>
  <p>© 2026 School of Clowns</p>
</footer>

</body>
</html>
